name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin the Gradle version: the runner's preinstalled Gradle is newer
      # than AGP 8.7 supports (AGP 8.7 needs Gradle 8.9+ and does not
      # support Gradle 9).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools", but the legacy
          # "tools" package was removed from the SDK repository and makes
          # sdkmanager exit 1.
          packages: platform-tools

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # The wrapper JAR is not committed, so it is generated here with the
      # pinned Gradle version above.
      - name: Generate the Gradle wrapper
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.11.1

      # Keep one signing key across CI runs so a new APK can update the
      # previous one. The keystore lives only in Actions secrets.
      - name: Install the stable debug signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-app/debug.keystore

      - name: Assemble debug APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-app/debug.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-relay-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A public, stable download URL. Actions artifacts need a GitHub login;
      # the release asset is the link handed to the operator.
      - name: Publish rolling APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-latest"
          asset="sms-relay-debug.apk"
          apk="android-app/app/build/outputs/apk/debug/app-debug.apk"
          staged="${RUNNER_TEMP}/${asset}"
          notes="Rolling debug build from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "SMS Relay Android (latest)" \
              --notes "$notes" \
              --prerelease
          else
            gh release create "$tag" \
              --title "SMS Relay Android (latest)" \
              --notes "$notes" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          # The asset name is the basename of the uploaded file. Stage it
          # under the stable name so the documented URL never changes.
          cp "$apk" "$staged"
          gh release delete-asset "$tag" "app-debug.apk" --yes 2>/dev/null || true
          gh release upload "$tag" "$staged" --clobber
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}" \
            >> "$GITHUB_STEP_SUMMARY"
