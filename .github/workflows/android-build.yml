name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin the Gradle version: the runner's preinstalled Gradle is newer
      # than AGP 8.7 supports (AGP 8.7 needs Gradle 8.9+ and does not
      # support Gradle 9).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools", but the legacy
          # "tools" package was removed from the SDK repository and makes
          # sdkmanager exit 1.
          packages: platform-tools

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # The wrapper JAR is not committed, so it is generated here with the
      # pinned Gradle version above.
      - name: Generate the Gradle wrapper
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.11.1

      - name: Assemble debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-relay-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
